<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>محاكاة: ثلاثة مجاري أودية</title>
<style>
  @font-face { font-family: 'Assistant'; src: url('../fonts/Assistant-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Assistant'; src: url('../fonts/Assistant-ExtraBold.ttf') format('truetype'); font-weight: 800; }
  html, body { margin: 0; width: 1272px; height: 648px; overflow: hidden; background: #000; font-family: 'Assistant', sans-serif; direction: rtl; }
  button { font-family: inherit; }
  video, .poster { position: absolute; inset: 0; width: 1272px; height: 648px; object-fit: cover; object-position: 50% 100%; }   /* 16:9 video in a wider frame: crop the top, keep the channel labels */
  .poster { background: url('../images/channels-flow-poster.jpg') 50% 100% / cover; }
  .go { top: 110px; left: 422px; width: 427px; height: 427px; padding: 0; border: none; background: url('../images/ui-play.png') center / contain no-repeat; cursor: pointer; }   /* same PLAY button as the video screens */
  .go:hover { filter: brightness(1.1); }
  .again { bottom: 36px; transform: translateX(-50%); }
  .go { position: absolute; }
  .again { position: absolute; left: 50%; min-width: 200px; height: 72px; padding: 0 40px; border: none; border-radius: 20px; background: #404040; color: #fff; font-size: 38px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .go:focus-visible, .again:focus-visible { outline: 3px solid #299FD4; outline-offset: 3px; }
  .final { position: absolute; left: 0; right: 0; top: 28px; margin: 0 auto; width: 980px; padding: 14px 28px; text-align: center; border-radius: 22px; background: rgba(255,255,255,.93); color: #1A1A1A; font-size: 34px; font-weight: 700; line-height: 1.3; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .hidden { display: none; }
</style>
<link rel="stylesheet" href="../../fonts-ar.css">
<link rel="stylesheet" href="../../applet-ar.css">
</head>
<body>
<div class="poster" id="poster"></div>
<video id="v" playsinline preload="auto" disablepictureinpicture><source src="../videos/channels-flow.mp4" type="video/mp4"></video>
<p class="final hidden" id="final">تأمّلوا المجاري الثلاثة وقارنوا بين سرعة الجريان وارتفاع الماء.</p>
<button class="go" id="go" type="button" aria-label="تشغيل الفيديو"></button>
<button class="again hidden" id="again" type="button">ابدؤوا من جديد</button>
<script>
  'use strict';
  var v = document.getElementById('v'), go = document.getElementById('go'), again = document.getElementById('again'), fin = document.getElementById('final'), poster = document.getElementById('poster');
  v.style.visibility = 'hidden';
  go.addEventListener('click', function () {
    go.classList.add('hidden'); poster.classList.add('hidden'); v.style.visibility = 'visible';
    try { window.parent.postMessage({ type: 'APPLET_STARTED' }, '*'); } catch (e) {}
    v.currentTime = 0; v.play().catch(function () {});
  });
  // At the end the three channels stay in their final state for comparison, with the instruction and a restart button.
  v.addEventListener('ended', function () { fin.classList.remove('hidden'); again.classList.remove('hidden'); });
  // "Start over" replays the video straight away, without the PLAY button.
  again.addEventListener('click', function () {
    fin.classList.add('hidden'); again.classList.add('hidden');
    v.currentTime = 0; v.play().catch(function () {});
  });
</script>
</body>
</html>
